name: Bug report
description: Report a problem with AI PR Reviewer Guard
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Explain the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal example
      description: Share a small diff, file list, or workflow snippet.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0
